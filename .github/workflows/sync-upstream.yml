name: Sync VPSDance upstream

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'Dev-61/ai-proxy-rules'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/VPSDance/ai-proxy-rules.git
          git fetch --no-tags upstream main

      - name: Check required rule files
        run: |
          for file in \
            rules/clash/cn.yaml \
            rules/clash/global.yaml \
            rules/shadowrocket/cn.list \
            rules/shadowrocket/global.list
          do
            git cat-file -e "upstream/main:$file"
            test "$(git cat-file -s "upstream/main:$file")" -gt 0
          done

      - name: Merge upstream and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-edit upstream/main
          git push origin HEAD:main
